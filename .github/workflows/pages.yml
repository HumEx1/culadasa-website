# Publishes to GitHub Pages on every push to main:
#   site/      -> the root (the exact mirror of culadasa.com)
#   redesign/  -> /redesign/   (redesign draft: A2 + D2)
#   redesign-2/ -> /redesign-2/ (redesign draft 2: A2 sans base, more minimal)
# No build step: both folders are served exactly as committed.
name: Publish site
on:
  push:
    branches: [main]
    paths: ['site/**', 'redesign/**', 'redesign-2/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Assemble mirror and redesign
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp -a redesign _site/redesign
          cp -a redesign-2 _site/redesign-2
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Let GitHub register the upload
        # deploy-pages sometimes asks for the artifact before GitHub has recorded it
        # ("Fetching artifact metadata failed"); a short pause avoids that.
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v5

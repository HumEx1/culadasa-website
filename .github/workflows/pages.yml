# Publishes to GitHub Pages on every push to main:
#   site/      -> the root (the exact mirror of culadasa.com)
#   redesign/  -> /redesign/ (the redesign draft, for side-by-side review)
# No build step: both folders are served exactly as committed.
name: Publish site
on:
  push:
    branches: [main]
    paths: ['site/**', 'redesign/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Assemble mirror and redesign
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp -a redesign _site/redesign
          rm -rf _site/redesign/data/*.md
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
